name: customer_order_pipeline

tasks:
  - task_key: stage_orders
    notebook_task:
      notebook_path: /Repos/dev_ops/databricks/notebooks/ingestion/stage_orders

  - task_key: stage_customers
    notebook_task:
      notebook_path: /Repos/dev_ops/databricks/notebooks/ingestion/stage_customers

  - task_key: join_customer_orders
    depends_on:
      - task_key: stage_orders
      - task_key: stage_customers
    notebook_task:
      notebook_path: /Repos/dev_ops/databricks/notebooks/transformation/join_customer_orders
